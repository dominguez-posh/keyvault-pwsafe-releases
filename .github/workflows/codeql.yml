# Static analysis (SAST) of the JavaScript/TypeScript code and the workflows on every push, pull request and weekly.
# Results appear under Security → Code scanning (free for the public repository).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Code scanning is free for the public repository; the private source repository has no Advanced Security.
    if: github.repository == 'dominguez-posh/keyvault-pwsafe-releases'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
