# macOS and Linux builds of the desktop app on their native runners (unsigned previews). Started by hand
# (workflow_dispatch) or by a release tag; the artifacts are downloaded locally and attached to the GitHub
# release by scripts/release.ps1 (the Windows installers and the extension key stay local).
# #461: stamped as a release like the Windows builds of scripts/release.mjs (kvBuild in package.json, commit with "g").
name: Desktop macOS/Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mac:
    name: macOS (arm64 + x64, unsigniert)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac --arm64 --x64 --publish never -c.extraMetadata.kvBuild.kind=release -c.extraMetadata.kvBuild.commit=g$(git rev-parse --short HEAD)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac
          path: |
            release/*.dmg
            release/*-mac-*.zip
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux --x64 --publish never -c.extraMetadata.kvBuild.kind=release -c.extraMetadata.kvBuild.commit=g$(git rev-parse --short HEAD)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
