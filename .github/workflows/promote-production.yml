# Early Access → Prod. Runs in the PUBLIC repo dominguez-posh/keyvault-pwsafe-releases (exported there with the
# source): the very same pre-release – no new build, exactly the files tested in the field – becomes "Latest", and main
# moves forward to the release's source. Stable users get it within ten minutes (keevault.de/update caches 10 min).
#
# Only after approval: the public repo's environment "production" has the required reviewer (scripts/setup-ci-secrets.mjs
# sets it up – approval rules are free for public repos). Needs no keys: the repo's own token is enough.
name: Prod freigeben

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version der Early-Access-Vorabversion (z. B. 0.9.8)
        required: true
      min_hours:
        description: Mindestens so viele Stunden im Praxistest (0 = egal)
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Pre-Release → Latest
    # Only the public repo has the approval rule; anywhere else the job does nothing.
    if: github.repository == 'dominguez-posh/keyvault-pwsafe-releases'
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Vorabversion prüfen
        run: |
          set -euo pipefail
          info=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft,publishedAt)
          echo "$info"
          [ "$(echo "$info" | jq -r .isDraft)" = "false" ] || { echo "Entwurf – erst veröffentlichen"; exit 1; }
          [ "$(echo "$info" | jq -r .isPrerelease)" = "true" ] || { echo "$TAG ist keine Early-Access-Vorabversion (schon freigegeben?)"; exit 1; }
          published=$(date -d "$(echo "$info" | jq -r .publishedAt)" +%s)
          hours=$(( ( $(date +%s) - published ) / 3600 ))
          echo "Seit $hours Stunden im Praxistest"
          [ "$hours" -ge "${{ inputs.min_hours }}" ] || { echo "Erst $hours von ${{ inputs.min_hours }} Stunden im Praxistest"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: main auf den Stand der Version
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only forward: main must be an ancestor of the release (every Prod came from Early Access).
          # Exception: a merge on GitHub (e.g. a pull request from early-access) that adds no content of its own –
          # then main gets a merge commit with exactly the release's files, still without a force push.
          if ! git merge-base --is-ancestor HEAD "$TAG" && git diff --quiet "$(git merge-base HEAD "$TAG")" HEAD; then
            git merge --ff-only "$(git commit-tree "$TAG^{tree}" -p HEAD -p "$TAG" -m "main auf $TAG")"
          else
            git merge --ff-only "$TAG"
          fi
          git push --quiet origin main
      - name: Als „Latest" freigeben
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "Keevault ${{ inputs.version }}"
      - name: Website anstoßen
        # The website (and its live demo) is built in the private Dev repo: "Website veröffentlichen" there. Needs the
        # environment secret WEBSITE_DISPATCH_TOKEN (Actions: write on the Dev repo); without it this step only reports.
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          DEV_REPO: ${{ vars.DEV_REPO || 'dominguez-posh/keyvault-pwsafe' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::WEBSITE_DISPATCH_TOKEN fehlt – Website von Hand hochladen"; exit 0; fi
          gh workflow run website.yml --repo "$DEV_REPO" -f version="${{ inputs.version }}"
          echo "Website-Upload für ${{ inputs.version }} gestartet ($DEV_REPO)"
