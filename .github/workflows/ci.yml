# Every push: tests and checks, extension packages as artifact. Tags v*: additionally the portable Windows app.
# The installer and the GitHub release are built locally (scripts/release.ps1) – the extension key stays local.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Erweiterung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run ext:pack
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip

  desktop:
    name: Desktop-App (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ext:pack
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-portable
          path: release/*.exe
