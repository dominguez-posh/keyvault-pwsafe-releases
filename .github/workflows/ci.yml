# Every push: tests and checks, extension packages as artifact. Tags v*: additionally the portable Windows app.
# Smoke test on Windows on every push. Releases: early-access.yml (Dev → Early Access) and promote-production.yml.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Erweiterung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run ext:pack
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/*.zip

  smoke:
    name: Smoke-Test (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      # Keevault-Update.exe (clipboard, auto-type, rollback self-test) as the app uses it.
      - name: Hilfsprogramm bauen
        shell: pwsh
        run: |
          dotnet build windows/Setup -c Release -o windows/out/setup-update --nologo
          Copy-Item windows/out/setup-update/Keevault-Setup.exe windows/out/Keevault-Update.exe
      - run: npm test
      - run: npm run smoke

  desktop:
    name: Desktop-App (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ext:pack
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-portable
          path: release/*.exe
