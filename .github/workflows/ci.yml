# Push to main, tags v*, pull requests and by hand: tests and checks, extension packages as artifact, smoke test on Windows.
# Tags v* and by hand: additionally the portable Windows app. A push to another branch starts nothing (its smoke:
# smoke-branch.yml). Releases: early-access.yml (Dev → Early Access) and promote-production.yml.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests und Erweiterung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run ext:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension
          path: dist/*.zip

  smoke:
    name: Smoke-Test (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      # Keevault-Update.exe (clipboard, auto-type, rollback self-test) as the app uses it.
      - name: Hilfsprogramm bauen
        shell: pwsh
        run: |
          dotnet build windows/Setup -c Release -o windows/out/setup-update --nologo
          Copy-Item windows/out/setup-update/Keevault-Setup.exe windows/out/Keevault-Update.exe
      - run: npm test
      - run: npm run smoke

  desktop:
    name: Desktop-App (Windows)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ext:pack
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-portable
          path: release/*.exe
