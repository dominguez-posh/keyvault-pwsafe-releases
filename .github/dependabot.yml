# Dependency updates and security alerts: npm packages, GitHub Actions and the .NET projects (Windows helpers).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories: [/windows/PasskeyProvider, /windows/Setup]
    schedule:
      interval: monthly
