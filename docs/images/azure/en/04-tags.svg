"400" fill="#1b1b1f" text-anchor="start" font-family="Consolas, monospace">kvpwsafe-name</text><rect x="318" y="264" width="300" height="30" rx="4" fill="#fff" stroke="#d5d9e0" stroke-width="1"/><text x="330" y="284" font-size="13" font-weight="400" fill="#1b1b1f" text-anchor="start">Team Ops</text><text x="640" y="284" font-size="13" font-weight="400" fill="#1b1b1f" text-anchor="start">Key vault</text><rect x="20" y="220" width="602" height="78" rx="6" fill="none" stroke="#e8590c" stroke-width="2.5"/><circle cx="640" cy="222" r="12" fill="#e8590c"/><text x="640" y="226.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="24" y="326" font-size="13" font-weight="400" fill="#1b1b1f" text-anchor="start">“kvpwsafe-name” is the name everyone sees in Keevault. Then: “Review + create” → “Create”.</text>
